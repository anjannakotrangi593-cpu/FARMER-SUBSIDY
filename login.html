<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Log in | Telangana Farmer Schemes</title>
<link rel="stylesheet" href="css/style.css">
</head>
<body data-page="login">
<div class="auth">
  <aside class="field">
    <b class="mark" data-t>Telangana Farmer Schemes</b>
    <h2 data-t>See every scheme your land qualifies for.</h2>
    <p><span id="count"></span> <span data-t>state and central schemes, with the documents you need and the official apply link.</span></p>
  </aside>
  <main class="panel">
    <h1 data-t>Log in</h1>
    <p class="lead" data-t>Use the mobile number and password you registered with.</p>
    <form id="form" novalidate>
      <label><span data-t>Mobile number</span> <input id="mobile" type="tel" inputmode="numeric" maxlength="10" autocomplete="tel"></label>
      <label><span data-t>Password</span> <input id="pass" type="password" autocomplete="current-password"></label>
      <a href="forgot.html" data-t>Forgot password?</a>
      <button class="main" type="submit" data-t>Log in</button>
      <p id="msg" class="msg" role="alert"></p>
    </form>
    <p class="alt"><span data-t>New here?</span> <a href="register.html" data-t>Create an account</a></p>
  </main>
</div>
<script src="js/data.js"></script>
<script src="js/lang.js"></script>
<script src="js/app.js"></script>
</body>
</html>
