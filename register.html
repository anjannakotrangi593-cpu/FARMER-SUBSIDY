<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Create account | Telangana Farmer Schemes</title>
<link rel="stylesheet" href="css/style.css">
</head>
<body data-page="register">
<div class="auth">
  <aside class="field">
    <b class="mark" data-t>Telangana Farmer Schemes</b>
    <h2 data-t>See every scheme your land qualifies for.</h2>
    <p><span id="count"></span> <span data-t>state and central schemes, with the documents you need and the official apply link.</span></p>
  </aside>
  <main class="panel">
    <h1 data-t>Create your account</h1>
    <p class="lead" data-t>Your land area decides which schemes we show you first.</p>
    <form id="form" novalidate>
      <label><span data-t>Name</span> <input id="name" autocomplete="name"></label>
      <label><span data-t>Mobile number</span> <input id="mobile" type="tel" inputmode="numeric" maxlength="10" autocomplete="tel"></label>
      <label><span data-t>Land area in acres (enter 0 if you have no land)</span> <input id="land" type="number" inputmode="decimal" min="0" step="0.01"></label>
      <label><span data-t>Create password</span> <input id="pass" type="password" autocomplete="new-password"></label>
      <label><span data-t>Confirm password</span> <input id="confirm" type="password" autocomplete="new-password"></label>
      <button class="main" type="submit" data-t>Create account</button>
      <p id="msg" class="msg" role="alert"></p>
    </form>
    <p class="alt"><span data-t>Already have an account?</span> <a href="login.html" data-t>Log in</a></p>
  </main>
</div>
<script src="js/data.js"></script>
<script src="js/lang.js"></script>
<script src="js/app.js"></script>
</body>
</html>
